spring:
  application:
    name: petstore
  cloud:
    bus:
      enabled: true
  jackson:
    deserialization:
      accept-single-value-as-array: true

  kafka:
    bootstrap-servers:
      - localhost:9092
    consumer:
      group-id: petstore

  datasource:
    # JDBC URL format: jdbc:postgresql://<host>:<port>/<database_name>
    url: jdbc:postgresql://localhost:5432/petstore
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      jdbc-url: ${spring.datasource.url}
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}
      driver-class-name: ${spring.datasource.driver-class-name}
      schema: bobspetstore

  jpa:
    hibernate:
      # Options: none, validate, update, create, create-drop
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
    open-in-view: false
springdoc:
  # Path for the JSON OpenAPI specification (Default: /v3/api-docs)
  api-docs:
    enabled: true

  # Path for the Swagger HTML UI (Default: /swagger-ui.html)
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # Persist authorization data (JWT/API Keys) upon page refresh
    persistAuthorization: true
    # Sort endpoints alphabetically (can also be 'method')
    operationsSorter: alpha

server:
  address: localhost
  port: 8080
  servlet:
    context-path: /
logging:
  level:
    root: info
    '[org.hibernate.orm.connections.pooling]': ERROR
    '[org.hibernate.validator.internal.metadata.aggregated]': OFF