services: 
  petstore:
    image: petstore:latest
    hostname: petstore
    ports:
      - "8080:8080"  
    volumes:
      - ./src/test/resources/application.yml:/workspace/application.yml
    networks:
      - local-tier

  broker:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      # Configure the node to act as both a broker and a controller (KRaft mode)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Define internal and external listeners
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Required settings for single-node development
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks:
      - local-tier
  postgres:
    image: postgres:18
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: P@ssw0rd!  # Change this in production!
      POSTGRES_DB: petstore
      # Optional: Explicitly define PGDATA if you need strict path targeting
      # PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    shm_size: 128mb  # Recommended to avoid shared memory limits during heavy queries
    volumes:
      # Mount to the parent directory to accommodate PostgreSQL 18's versioned subdirectories
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-tier

volumes:
  postgres_data:
    driver: local

networks:
  local-tier:
    driver: bridge